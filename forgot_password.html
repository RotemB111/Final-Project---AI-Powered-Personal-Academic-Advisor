<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שחזור סיסמה - Easy Schedule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar" style="color: white;">
        <div style="font-size: 16px; padding-right: 20px;">
            Easy Schedule
        </div>
        <div style="position: absolute; left: 50%; transform: translateX(-50%); font-size: 1.25rem; font-weight: bold;">
            שחזור פרטי התחברות
        </div>
    </div>

    <div class="auth-box">
        <h2>שכחת סיסמה? 🔒</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem;">
            הזן את כתובת האימייל או תעודת הזהות שלך, ואנחנו נשלח לך קישור מאובטח לאיפוס הסיסמה.
        </p>
        
        <form onsubmit="event.preventDefault(); alert('✅ קישור לאיפוס סיסמה נשלח למייל שלך!'); window.location.href='index.html';">
            <label>אימייל או תעודת זהות:</label>
            <input type="text" placeholder="הזן פרטים מזהים..." required>
            
            <button type="submit" class="main-btn" style="margin-top: 10px;">שלח קישור לאיפוס</button>
            <a href="index.html" class="secondary-btn" style="display: block; line-height: 24px; margin-top: 15px;">חזור להתחברות</a>
        </form>
    </div>
</body>
</html>
