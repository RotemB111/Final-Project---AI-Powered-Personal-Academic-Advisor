<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אזור אישי - Easy Schedule</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        .profile-card-header {
            background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 100%);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(15, 107, 79, 0.2);
        }

        .form-section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 25px;
        }

#edit_mail {
    direction: ltr;
    text-align: left;
}
    </style>
    <script src="config.js"></script>
</head>
<body>
    <div class="navbar" style="color: white; display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 16px;">הגדרות חשבון</div>
        <div style="position: absolute; left: 50%; transform: translateX(-50%); font-size: 1.25rem; font-weight: bold;">
            Easy Schedule - אזור אישי
        </div>
        <div class="nav-links">
            <a href="dashboard.html" style="display: flex; align-items: center; gap: 8px; background-color: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 16px; border-radius: 50px; text-decoration: none; font-size: 0.9rem; font-weight: bold; transition: 0.2s;" onmouseover="this.style.backgroundColor='rgba(255,255,255,0.25)'" onmouseout="this.style.backgroundColor='rgba(255,255,255,0.15)'">
                חזור למערכת
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);"><path d="M19 12H6M12 5l-7 7 7 7"/></svg>
            </a>
        </div>
    </div>

    <div class="main-container" style="display: block; max-width: 600px; margin: 40px auto; height: auto; padding-bottom: 40px;">
        <div class="chat-container" style="padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
            
            <div class="profile-card-header">
                <div class="profile-avatar" id="user-initial">?</div>
                <div>
                    <h2 style="margin: 0; color: var(--text); font-size: 1.6rem; font-weight: 800;" id="display-name">טוען...</h2>
                    <div style="color: var(--text-muted); font-size: 0.95rem;">עריכת פרטים אישיים</div>
                </div>
            </div>

            <form id="profileForm" onsubmit="handleProfileUpdate(event)">
                
                <div class="input-group">
                    <label class="form-section-label">שם משתמש:</label>
                    <input type="text" id="edit_user_name" required>
                </div>

<div class="input-group">
    <label class="form-section-label">מייל:</label>
    <input type="email" id="edit_mail" required placeholder="example@afeka.ac.il">
</div>

                <div class="input-group">
                    <label class="form-section-label">מסלול לימודים:</label>
                    <select id="edit_program_id" required style="cursor: pointer;">
                        <option value="" disabled>בחר מסלול מהרשימה...</option>
                        <option value="1">הנדסת תעשייה וניהול</option>
                        <option value="2">הנדסת תוכנה</option>
                        <option value="3">מערכות מידע</option>
                    </select>
                </div>

                <div class="input-group">
                    <label class="form-section-label">שנת לימוד:</label>
                    <select id="edit_study_year" required style="cursor: pointer;">
                        <option value="" disabled>בחר שנת לימוד...</option>
                        <option value="1">שנה א'</option>
                        <option value="2">שנה ב'</option>
                        <option value="3">שנה ג'</option>
                        <option value="4">שנה ד'</option>
                        <option value="5">שנה ה' / אחר</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" class="main-btn" style="width: 100%; margin-top: 10px; padding: 15px;">שמור שינויים</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                const user = JSON.parse(storedUser);
                const name = user.name || "סטודנט";
                
                document.getElementById('display-name').innerText = name;
                document.getElementById('user-initial').innerText = name.charAt(0).toUpperCase();

                // מילוי השדות בערכים הקיימים
                document.getElementById('edit_user_name').value = name;
                if(user.program_id) document.getElementById('edit_program_id').value = user.program_id;
                if(user.study_year) document.getElementById('edit_study_year').value = user.study_year;
                if(user.email) document.getElementById('edit_mail').value = user.email;
            }
        });

        async function handleProfileUpdate(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerHTML = 'שומר שינויים בשרת... ⏳';
            submitBtn.disabled = true;

            const newName = document.getElementById('edit_user_name').value;
            const newMail = document.getElementById('edit_mail').value;
            const newProgram = parseInt(document.getElementById('edit_program_id').value);
            const newYear = parseInt(document.getElementById('edit_study_year').value);

            try {
                const storedUser = JSON.parse(localStorage.getItem('currentUser'));
                if (!storedUser || !storedUser.id) throw new Error("לא נמצא מזהה משתמש");

                // --- העדכון מתבצע בשרת ---
                const response = await fetch(`${API_BASE}/api/profile/${storedUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_name: newName,
                        program_id: newProgram,
                        study_year: newYear,
                        email: newMail
                    })
                });
                const result = await response.json();
                if (!result.success) throw new Error(result.error || 'העדכון נכשל');

                // עדכון הזיכרון המקומי
                storedUser.name = newName;
                storedUser.program_id = newProgram;
                storedUser.study_year = newYear;
                storedUser.email = newMail;
                localStorage.setItem('currentUser', JSON.stringify(storedUser));

                // עדכון התצוגה בעמוד
                document.getElementById('display-name').innerText = newName;
                document.getElementById('user-initial').innerText = newName.charAt(0).toUpperCase();

                Swal.fire({
                    title: 'הפרטים עודכנו!',
                    text: 'השינויים נשמרו בהצלחה במסד הנתונים.',
                    icon: 'success',
                    confirmButtonText: 'מעולה',
                    confirmButtonColor: '#0f6b4f'
                });

            } catch (err) {
                console.error("שגיאה:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'תקלה בשמירה',
                    text: 'לא הצלחנו לעדכן את הפרטים בשרת.',
                    confirmButtonColor: '#0f6b4f'
                });
            } finally {
                submitBtn.innerHTML = 'שמור שינויים';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
