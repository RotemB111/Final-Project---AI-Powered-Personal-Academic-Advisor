# Free-tier keep-alive: once a day, wake the Render server and make it run one Supabase query,
# so the free Supabase project is never paused for inactivity.
name: Keep alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://course-scheduler-api.onrender.com' }}
    steps:
      - name: Ping /api/health (allows ~2 minutes for a cold start)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "$API_URL/api/health"; then exit 0; fi
            echo "attempt $i failed, retrying..."; sleep 20
          done
          exit 1
